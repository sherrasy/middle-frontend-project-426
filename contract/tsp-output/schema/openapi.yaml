openapi: 3.1.0
info:
  title: Computer shop app
  version: 0.0.0
tags:
  - name: Auth
  - name: Catalog
paths:
  /auth/login:
    post:
      operationId: AuthApi_login
      description: Вход по email и паролю
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: AuthApi_logout
      description: Выход из системы
      parameters: []
      responses:
        '204':
          description: Ответ для успешного выхода
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Auth
  /auth/me:
    get:
      operationId: AuthApi_getCurrentUser
      description: Получить текущего авторизованного пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Auth
  /auth/register:
    post:
      operationId: AuthApi_register
      description: Регистрация нового пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /catalog/categories:
    get:
      operationId: CatalogApi_getCategories
      description: Получить список категорий
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Catalog
  /catalog/products:
    get:
      operationId: CatalogApi_getProducts
      description: Получить список товаров с фильтрацией и пагинацией
      parameters:
        - name: query
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CatalogQuery'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Catalog
components:
  schemas:
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Токен авторизации
          examples:
            - eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/User'
          description: Данные пользователя
      description: Ответ после успешной регистрации или входа
    CatalogQuery:
      type: object
      properties:
        categoryId:
          type: integer
          format: int32
          description: ID категории для фильтрации
          examples:
            - 1
        search:
          type: string
          description: Поиск по названию
          examples:
            - Ryzen
        priceFrom:
          $ref: '#/components/schemas/Money'
          description: Минимальная цена
          examples:
            - 10000
        priceTo:
          $ref: '#/components/schemas/Money'
          description: Максимальная цена
          examples:
            - 50000
        onlyAvailable:
          type: boolean
          description: Только доступные товары
          examples:
            - false
        page:
          type: integer
          format: int32
          minimum: 1
          description: Номер страницы (начиная с 1)
          examples:
            - 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Размер страницы
          examples:
            - 12
      description: Параметры фильтрации и пагинации
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор
          examples:
            - 1
        name:
          type: string
          description: Название категории
          examples:
            - Процессоры
      description: Категория товара
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP-код ошибки
          examples:
            - 404
        message:
          type: string
          description: Текст ошибки для пользователя
          examples:
            - Данные не найдены
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          examples:
            - demo+1785426603748@example.com
        password:
          type: string
          description: Пароль
          examples:
            - securepassword
      description: Тело запроса входа
    Money:
      type: integer
      format: int32
      minimum: 0
      description: Денежная сумма в целых рублях без копеек
      examples:
        - 1500
    Product:
      type: object
      required:
        - id
        - name
        - price
        - description
        - image
        - isAccessible
        - categoryId
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор
          examples:
            - 1
        name:
          type: string
          description: Название
          examples:
            - AMD Ryzen 5 7600X
        price:
          $ref: '#/components/schemas/Money'
          description: Цена в рублях
          examples:
            - 21990
        description:
          type: string
          description: Краткое описание
          examples:
            - Процессор 6 ядер, 12 потоков, сокет AM5.
        image:
          anyOf:
            - type: string
            - type: 'null'
          description: URL изображения или null
          examples:
            - https://example.com/ryzen5.jpg
        isAccessible:
          type: boolean
          description: Доступность товара
          examples:
            - true
        categoryId:
          type: integer
          format: int32
          description: Идентификатор категории
          examples:
            - 1
      description: Товар
    ProductList:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: Товары на текущей странице
        total:
          type: integer
          format: int32
          description: Общее количество товаров
          examples:
            - 150
        page:
          type: integer
          format: int32
          description: Номер текущей страницы
          examples:
            - 1
        pageSize:
          type: integer
          format: int32
          description: Размер страницы
          examples:
            - 12
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц
          examples:
            - 13
      description: Список товаров с пагинацией
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          examples:
            - demo+1785426603748@example.com
        password:
          type: string
          minLength: 8
          description: Пароль (минимум 8 символов)
          examples:
            - securepassword
      description: Тело запроса регистрации
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор
          examples:
            - 42
        email:
          type: string
          description: Email
          examples:
            - user@example.com
        name:
          type: string
          description: Отображаемое имя
          examples:
            - Иван
      description: Пользователь (покупатель)
    ValidationDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Имя поля
        message:
          type: string
          description: Описание проблемы
    ValidationError:
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
          description: Список проблемных полей
      allOf:
        - $ref: '#/components/schemas/Error'
