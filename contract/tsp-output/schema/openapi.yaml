openapi: 3.1.0
info:
  title: Computer shop app
  version: 0.0.0
tags:
  - name: Auth
  - name: Catalog
  - name: Promo
  - name: Orders
paths:
  /auth/login:
    post:
      operationId: AuthApi_login
      description: Вход по email и паролю
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: AuthApi_logout
      description: Выход из системы
      parameters: []
      responses:
        '204':
          description: Ответ для успешного выхода
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Auth
  /auth/me:
    get:
      operationId: AuthApi_getCurrentUser
      description: Получить текущего авторизованного пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Auth
  /auth/register:
    post:
      operationId: AuthApi_register
      description: Регистрация нового пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /catalog/categories:
    get:
      operationId: CatalogApi_getCategories
      description: Получить список категорий
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Catalog
  /catalog/products:
    get:
      operationId: CatalogApi_getProducts
      description: Получить список товаров с фильтрацией и пагинацией
      parameters:
        - name: query
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CatalogQuery'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Catalog
  /catalog/products/{id}:
    get:
      operationId: CatalogApi_getProduct
      description: Получить один товар
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Catalog
  /orders:
    post:
      operationId: OrdersApi_createOrder
      description: Создать новый заказ.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/OrderCreationError'
                  - $ref: '#/components/schemas/Error'
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
    get:
      operationId: OrdersApi_getMyOrders
      description: Получить список всех заказов пользователя
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Orders
  /orders/{id}:
    get:
      operationId: OrdersApi_getOrder
      description: Получить детализацию заказа
      parameters:
        - name: id
          in: path
          required: true
          description: ИД заказа
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Orders
  /promo:
    get:
      operationId: PromoApi_getPromoBlocks
      description: Получить список промо-блоков для главной страницы
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoBlock'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Promo
components:
  schemas:
    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Токен авторизации
          examples:
            - eyJhbGciOiJIUzI1NiIs...
        user:
          $ref: '#/components/schemas/User'
          description: Данные пользователя
      description: Ответ после успешной регистрации или входа
    CartItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int32
          description: ИД товара
          examples:
            - 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Количество товара
          examples:
            - 2
      description: Элементы корзины для создания заказа
    CatalogQuery:
      type: object
      properties:
        categoryId:
          type: integer
          format: int32
          description: ID категории для фильтрации
          examples:
            - 1
        search:
          type: string
          description: Поиск по названию
          examples:
            - Ryzen
        priceFrom:
          $ref: '#/components/schemas/Money'
          description: Минимальная цена
          examples:
            - 10000
        priceTo:
          $ref: '#/components/schemas/Money'
          description: Максимальная цена
          examples:
            - 50000
        onlyAvailable:
          type: boolean
          description: Только доступные товары
          examples:
            - false
        page:
          type: integer
          format: int32
          minimum: 1
          description: Номер страницы (начиная с 1)
          examples:
            - 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Размер страницы
          examples:
            - 12
      description: Параметры фильтрации и пагинации
    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
          description: ИД
          examples:
            - 1
        name:
          type: string
          description: Название категории
          examples:
            - Процессоры
      description: Категория товара
    CreateOrderRequest:
      type: object
      required:
        - deliveryMethod
        - recipientName
        - recipientPhone
        - items
      properties:
        deliveryMethod:
          $ref: '#/components/schemas/DeliveryMethod'
          description: Способ получения
        recipientName:
          type: string
          minLength: 1
          description: Имя получателя
          examples:
            - Иван Иванов
        recipientPhone:
          type: string
          minLength: 5
          description: Телефон получателя
          examples:
            - '+79991234567'
        deliveryAddress:
          type: string
          description: 'Адрес доставки '
          examples:
            - г. Москва, ул. Примерная, д. 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemRequest'
          minItems: 1
          description: Состав корзины
      description: Тело запроса на создание заказа
    DeliveryMethod:
      type: string
      enum:
        - delivery
        - pickup
      description: Способ получения заказа
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP-код ошибки
          examples:
            - 404
        message:
          type: string
          description: Текст ошибки для пользователя
          examples:
            - Данные не найдены
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          examples:
            - demo+1785426603748@example.com
        password:
          type: string
          description: Пароль
          examples:
            - securepassword
      description: Тело запроса входа
    Money:
      type: integer
      format: int32
      minimum: 0
      description: Денежная сумма в целых рублях без копеек
      examples:
        - 1500
    Order:
      type: object
      required:
        - id
        - createdAt
        - status
        - deliveryMethod
        - recipientName
        - recipientPhone
        - items
        - totalAmount
      properties:
        id:
          type: integer
          format: int32
          description: ИД заказа
          examples:
            - 1001
        createdAt:
          type: string
          format: date-time
          description: Дата и время создания заказа
          examples:
            - '2026-10-01T12:00:00Z'
        status:
          $ref: '#/components/schemas/OrderStatus'
          description: Статус заказа
        deliveryMethod:
          $ref: '#/components/schemas/DeliveryMethod'
          description: Способ получения
        recipientName:
          type: string
          description: Имя получателя
          examples:
            - Иван Петров
        recipientPhone:
          type: string
          description: Телефон получателя
          examples:
            - +7 (999) 000-11-22
        deliveryAddress:
          anyOf:
            - type: string
            - type: 'null'
          description: Адрес доставки
          examples:
            - ул. Ленина, д. 15, кв. 42
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: Позиции заказа
        totalAmount:
          $ref: '#/components/schemas/Money'
          description: Итоговая сумма заказа
          examples:
            - 43980
      description: Заказ
    OrderCreationError:
      type: object
      required:
        - problematicProducts
      properties:
        problematicProducts:
          type: array
          items:
            $ref: '#/components/schemas/ProblematicProduct'
          description: Список проблемных товаров
      allOf:
        - $ref: '#/components/schemas/Error'
      description: Ошибка создания заказа
    OrderItem:
      type: object
      required:
        - productId
        - productName
        - quantity
        - price
        - total
      properties:
        productId:
          type: integer
          format: int32
          description: ИД товара
          examples:
            - 1
        productName:
          type: string
          description: Название товара на момент покупки
          examples:
            - AMD Ryzen 5 7600X
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Количество единиц товара
          examples:
            - 2
        price:
          $ref: '#/components/schemas/Money'
          description: Цена за единицу товара
          examples:
            - 21990
        total:
          $ref: '#/components/schemas/Money'
          description: Сумма по данной позиции
          examples:
            - 43980
      description: Позиция заказа (снимок товара)
    OrderList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: Заказы пользователя
        total:
          type: integer
          format: int32
          description: Общее количество заказов
          examples:
            - 5
      description: Список заказов пользователя
    OrderStatus:
      type: string
      enum:
        - paid
      description: Статус заказа
    ProblematicProduct:
      type: object
      required:
        - productId
        - reason
      properties:
        productId:
          type: integer
          format: int32
          description: ИД товара
          examples:
            - 1
        reason:
          type: string
          description: Причина проблемы
          examples:
            - Товар недоступен для покупки
      description: Проблемный товар, из-за которого невозможно создать заказ
    Product:
      type: object
      required:
        - id
        - name
        - price
        - description
        - image
        - isAccessible
        - categoryId
      properties:
        id:
          type: integer
          format: int32
          description: ИД
          examples:
            - 1
        name:
          type: string
          description: Название
          examples:
            - AMD Ryzen 5 7600X
        price:
          $ref: '#/components/schemas/Money'
          description: Цена в рублях
          examples:
            - 21990
        description:
          type: string
          description: Краткое описание
          examples:
            - Процессор 6 ядер, 12 потоков, сокет AM5.
        image:
          anyOf:
            - type: string
            - type: 'null'
          description: URL изображения или null
          examples:
            - https://example.com/ryzen5.jpg
        isAccessible:
          type: boolean
          description: Доступность товара
          examples:
            - true
        categoryId:
          type: integer
          format: int32
          description: ИД категории
          examples:
            - 1
      description: Товар
    ProductList:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: Товары на текущей странице
        total:
          type: integer
          format: int32
          description: Общее количество товаров
          examples:
            - 150
        page:
          type: integer
          format: int32
          description: Номер текущей страницы
          examples:
            - 1
        pageSize:
          type: integer
          format: int32
          description: Размер страницы
          examples:
            - 12
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц
          examples:
            - 13
      description: Список товаров с пагинацией
    PromoBlock:
      type: object
      required:
        - id
        - title
        - description
        - product
      properties:
        id:
          type: integer
          format: int32
          description: ИД промо-блока
          examples:
            - 1
        title:
          type: string
          description: Заголовок промо-блока
          examples:
            - Мощный процессор для игр
        description:
          type: string
          description: Текст промо-блока
          examples:
            - AMD Ryzen 5 7600X — идеальный выбор для гейминга.
        product:
          $ref: '#/components/schemas/Product'
          description: Рекламируемый товар
      description: Промо-блок
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          examples:
            - demo+1785426603748@example.com
        password:
          type: string
          minLength: 8
          description: Пароль (минимум 8 символов)
          examples:
            - securepassword
      description: Тело запроса регистрации
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int32
          description: ИД
          examples:
            - 42
        email:
          type: string
          description: Email
          examples:
            - user@example.com
        name:
          type: string
          description: Отображаемое имя
          examples:
            - Иван
      description: Пользователь (покупатель)
    ValidationDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Имя поля
        message:
          type: string
          description: Описание проблемы
    ValidationError:
      type: object
      properties:
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'
          description: Список проблемных полей
      allOf:
        - $ref: '#/components/schemas/Error'
